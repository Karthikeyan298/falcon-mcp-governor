<div class="panel-header">
  <h3>Audit trail</h3>
  <button class="ghost-btn" type="button" (click)="exportAuditLog()">Export log</button>
</div>
<div class="panel-scroll">
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Agent</th>
        <th>Tool</th>
        <th>Decision</th>
        <th>Arguments</th>
        <th>Reason</th>
        <th>User</th>
      </tr>
    </thead>
    <tbody>
      @for (entry of state.auditTrail; track entry.time + entry.tool) {
        <tr>
          <td>{{ entry.time }}</td>
          <td>{{ entry.agent }}</td>
          <td>{{ entry.tool }}</td>
          <td>
            <span class="badge" [ngClass]="{
              allowed: entry.decision === 'Allowed',
              blocked: entry.decision === 'Denied',
              pending: entry.decision === 'Pending'
            }">{{ entry.decision }}</span>
          </td>
          <td class="args-cell">{{ argsSummary(entry.arguments) }}</td>
          <td class="args-cell">{{ entry.reason ?? '—' }}</td>
          <td>{{ entry.user }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
